[project]
name = "eyewear-scraper"
version = "0.1.0"
description = "Catalog ingestion service for caprioptics.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "Pillow>=10.4.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
# Phase 6 try-on assets (background removal). Install with:
#   ./scripts/setup_tryon.sh          (or: uv sync --extra tryon)
# Heavy extra (~300 MB: onnxruntime, scikit-image, scipy) plus a ~175 MB u2net
# model downloaded on first use — keep it out of the default dependency set.
tryon = [
    # rembg[cpu] pulls onnxruntime; plain `rembg` installs without an inference
    # runtime and fails at call time.
    "rembg[cpu]>=2.0.57",
    # numba (pulled in by pymatting) has no wheels built against numpy 2.5+, and
    # rembg does not floor pymatting. Left free, the resolver keeps numpy 2.5 and
    # walks the chain back to pymatting 1.1.14 → numba 0.53.1 → llvmlite 0.36.0 —
    # sdist-only 2021 releases that need LLVM 11 and fail to build on Python 3.12+
    # ("Cannot install on Python version 3.13.13; only >=3.6,<3.10 supported").
    # These two bounds keep it on wheels for every interpreter we support.
    "numpy<2.5",
    "pymatting>=1.1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
