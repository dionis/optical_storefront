[project]
name = "eyewear-scraper"
version = "0.1.0"
description = "Catalog ingestion service for caprioptics.com"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "Pillow>=10.4.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0.2",
    "click>=8.1.7",
    "aiofiles>=24.1.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]
# rembg requires Python <3.13; install separately for Phase 6 try-on work:
#   pip install "rembg>=2.0.57"
tryon = [
    "rembg>=2.0.57; python_version < '3.13'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
