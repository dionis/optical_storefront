<!doctype html>
<html lang="%TENANT_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="%TENANT_THEME_COLOR%" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Probador virtual: precalienta la conexión al CDN del modelo de detección
         facial (MediaPipe) y al host del modelo, para que el estudio abra más rápido. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <!-- Fotos del catálogo (Supabase Storage) y Store API en modo directo:
         precalentar DNS+TLS ahorra ~100-300 ms en la PRIMERA imagen y la
         primera llamada de datos, que son el LCP del catálogo. -->
    <link rel="preconnect" href="https://svuuuobjgrkscsjgpwkx.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://svuuuobjgrkscsjgpwkx.supabase.co" />
    <link rel="preconnect" href="%TENANT_API_ORIGIN%" crossorigin />
    <link rel="dns-prefetch" href="%TENANT_API_ORIGIN%" />
    <!-- Fuentes SIN bloquear el primer pintado: la hoja llega como "print"
         (no bloquea render) y al cargar se promociona a "all". display=swap ya
         garantiza texto visible con la fuente del sistema mientras tanto. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap"
            rel="stylesheet" />
    </noscript>
    <title>%TENANT_TITLE%</title>
    <meta name="description" content="%TENANT_DESCRIPTION%" />

    <!-- Open Graph / redes sociales -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%TENANT_SOCIAL_TITLE%" />
    <meta property="og:title" content="%TENANT_SOCIAL_TITLE%" />
    <meta property="og:description" content="%TENANT_SOCIAL_DESCRIPTION%" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%TENANT_SOCIAL_TITLE%" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <!-- Organization schema for the site as a whole; product pages add their own
         Product JSON-LD from src/lib/seo.js. Filled from tenants/<slug>/tenant.json. -->
    <script type="application/ld+json">
    {
%TENANT_ORG_JSONLD%
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
