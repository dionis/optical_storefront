name: Scraper — Daily Catalog Sync

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-sync (ignore state cache)"
        required: false
        default: "false"
        type: boolean
      collection:
        description: "Sync a single collection slug (leave blank for all)"
        required: false
        default: ""
        type: string

jobs:
  sync:
    name: Catalog sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        working-directory: apps/scraper
        # [tryon] pulls rembg + onnxruntime so the sync can generate the
        # background-removed PNGs under tryon/. Drop the extra to skip them —
        # process_product_images() degrades gracefully, logging
        # "rembg failed … No module named 'rembg'" per image.
        run: pip install -e ".[tryon]"

      - name: Cache the u2net background-removal model
        uses: actions/cache@v4
        with:
          # rembg downloads ~175 MB into ~/.u2net on its first call. Uncached,
          # every scheduled run re-downloads it before the first product.
          path: ~/.u2net
          key: u2net-model-v1

      - name: Check required secrets
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
          MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
        run: |
          # Undefined GitHub secrets interpolate to an empty string, so without this
          # gate the job fails deep inside the sync with an opaque httpx error.
          missing=""
          [ -n "$MEDUSA_BACKEND_URL" ] || missing="$missing MEDUSA_BACKEND_URL"
          [ -n "$MEDUSA_ADMIN_API_KEY" ] || missing="$missing MEDUSA_ADMIN_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$MEDUSA_BACKEND_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::MEDUSA_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      - name: Restore incremental sync state
        uses: actions/cache@v4
        with:
          # state.db holds the last-seen content hash per product handle. Without it
          # the runner starts empty, has_changed() is True for every product, and each
          # scheduled run re-pushes the whole catalog and re-runs paid AI translation.
          # The run_id key never hits, so restore-keys falls back to the newest prior
          # entry and the post-step always writes a fresh one (cache keys are immutable).
          path: apps/scraper/state.db
          key: scraper-state-${{ github.run_id }}
          restore-keys: |
            scraper-state-

      - name: Run scraper sync
        working-directory: apps/scraper
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
          MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
          MEDUSA_SALES_CHANNEL_ID: ${{ secrets.MEDUSA_SALES_CHANNEL_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_REGION: ${{ secrets.R2_REGION }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read inputs through env, never interpolated into the shell body.
          INPUT_FULL: ${{ github.event.inputs.full }}
          INPUT_COLLECTION: ${{ github.event.inputs.collection }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${INPUT_FULL:-false}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ -n "${INPUT_COLLECTION:-}" ]; then
            ARGS="$ARGS --collection $INPUT_COLLECTION"
          fi
          python -m scraper sync $ARGS
