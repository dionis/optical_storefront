version: "3.9"

# Production compose for a single Hetzner CX22 VPS (4 GB RAM) managed by Coolify.
# SSL and domain routing are handled by Coolify (Traefik) — no reverse proxy here.
#
# NOTE: backend and storefront are actually deployed as standalone Coolify
# Applications (each with its own Dockerfile build), not via this file — see
# apps/backend/Dockerfile and apps/capri-storefront/vercel.json. This compose
# file documents the intended memory budget and is usable for a local
# prod-like `docker compose up`, but is not what drives the real deploy.
#
# Memory limits sized to stay within 4 GB total:
#   backend   512 MB (now also runs vision-measure as a second process inside
#                     the same container — see apps/backend/docker-entrypoint.sh
#                     — rather than as its own app/domain)
#   storefront 256 MB
#   postgres   512 MB
#   redis      128 MB
#   meilisearch 512 MB
#   backup cron 64 MB
# Total headroom: ~2 GB for OS + Coolify

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE}
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      BACKEND_URL: ${BACKEND_URL}
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      # Prescriptions are health data and must never share the public assets
      # bucket — the backend falls back to R2_BUCKET when this is unset.
      R2_PRESCRIPTION_BUCKET: ${R2_PRESCRIPTION_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_REGION: ${R2_REGION}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      # Also read by the bundled vision-measure process (apps/vision-measure) for
      # its "Anthropic (Claude)" provider — one key, two consumers, since both
      # run in this same container. All of the vars below are exclusively for
      # vision-measure's other providers and are optional: without one, the
      # try-on's AI panel just asks the operator to type that provider's key by
      # hand for the session.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}
      XAI_API_KEY: ${XAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY}
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  storefront:
    image: ${STOREFRONT_IMAGE}
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${BACKEND_URL}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEILISEARCH_HOST: ${MEILISEARCH_PUBLIC_HOST}
      NEXT_PUBLIC_MEILISEARCH_SEARCH_KEY: ${MEILISEARCH_SEARCH_KEY}
      NEXT_PUBLIC_CDN_HOSTNAME: ${CDN_HOSTNAME}
      NEXT_PUBLIC_CDN_URL: ${CDN_URL}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # vision-measure ("AI option 2" of the try-on) no longer has its own service
  # block: it runs bundled inside `backend`'s container as a second process
  # (apps/backend/docker-entrypoint.sh), reachable only at 127.0.0.1:8008 from
  # inside that same container. See apps/backend/src/api/vision-measure/.

  # Nightly pg_dump → R2 backup, retains 14 days
  backup:
    image: postgres:16-alpine
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_REGION: ${R2_REGION}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
    command: >
      sh -c "echo '0 2 * * * /backup.sh' | crontab - && crond -f -d 8"
    deploy:
      resources:
        limits:
          memory: 64m

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
