name: Scraper — Daily Catalog Sync

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-sync (ignore state cache)"
        required: false
        default: "false"
        type: boolean
      collection:
        description: "Sync a single collection slug (leave blank for all)"
        required: false
        default: ""
        type: string

jobs:
  sync:
    name: Catalog sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        working-directory: apps/scraper
        run: pip install -e "."

      - name: Check required secrets
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
          MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
        run: |
          # Undefined GitHub secrets interpolate to an empty string, so without this
          # gate the job fails deep inside the sync with an opaque httpx error.
          missing=""
          [ -n "$MEDUSA_BACKEND_URL" ] || missing="$missing MEDUSA_BACKEND_URL"
          [ -n "$MEDUSA_ADMIN_API_KEY" ] || missing="$missing MEDUSA_ADMIN_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$MEDUSA_BACKEND_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::MEDUSA_BACKEND_URL must start with http:// or https://"
              exit 1
              ;;
          esac

      - name: Run scraper sync
        working-directory: apps/scraper
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
          MEDUSA_ADMIN_API_KEY: ${{ secrets.MEDUSA_ADMIN_API_KEY }}
          MEDUSA_SALES_CHANNEL_ID: ${{ secrets.MEDUSA_SALES_CHANNEL_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          MEILISEARCH_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILISEARCH_MASTER_KEY: ${{ secrets.MEILISEARCH_MASTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read inputs through env, never interpolated into the shell body.
          INPUT_FULL: ${{ github.event.inputs.full }}
          INPUT_COLLECTION: ${{ github.event.inputs.collection }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${INPUT_FULL:-false}" = "true" ]; then
            ARGS="$ARGS --full"
          fi
          if [ -n "${INPUT_COLLECTION:-}" ]; then
            ARGS="$ARGS --collection $INPUT_COLLECTION"
          fi
          python -m scraper sync $ARGS
