name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @eyewear/shared build

      - name: Typecheck all
        run: pnpm typecheck

      - name: Lint all
        run: pnpm lint

  test-backend:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @eyewear/shared build

      - name: Run backend tests
        run: pnpm --filter @eyewear/backend test

  test-scraper:
    name: Scraper parser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper dependencies
        working-directory: apps/scraper
        run: pip install -e ".[dev]"

      - name: Run scraper tests
        working-directory: apps/scraper
        run: pytest tests/ -v

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test-backend, test-scraper]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_TOKEN: ${{ secrets.COOLIFY_WEBHOOK_TOKEN }}
        run: |
          # Coolify already auto-deploys from `main` via its own git integration.
          # This optional webhook only fires when the secret is configured, so an
          # empty/unset secret must be a graceful skip — never a failed CI run.
          if [ -z "$COOLIFY_WEBHOOK_URL" ]; then
            echo "COOLIFY_WEBHOOK_URL not configured — skipping webhook (Coolify auto-deploys from main)."
            exit 0
          fi
          curl -X POST "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_WEBHOOK_TOKEN" \
            --fail
